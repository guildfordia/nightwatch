<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>irssi</title>
    <style>
        /* CSS Variables for themes */
        :root {
            /* Dark theme (default) */
            --bg-primary: #000000;
            --bg-secondary: #000088;
            --bg-secondary-hover: #0000aa;
            --text-primary: #cccccc;
            --text-secondary: #ffffff;
            --text-system: #0088ff;
            --text-error: #ff0000;
            --text-join: #00ff00;
            --text-highlight: #ffff00;
            --text-time: #888888;
            --text-nick-self: #ffb3d9;
            --text-nick-other: #b3e5d1;
            --text-own: #ffffff;
            --border-color: #333333;
            --user-list-bg: #000000;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #e6e6fa;
            --bg-secondary-hover: #d0d0d0;
            --text-primary: #333333;
            --text-secondary: #000000;
            --text-system: #0066cc;
            --text-error: #cc0000;
            --text-join: #008800;
            --text-highlight: #cc6600;
            --text-time: #666666;
            --text-nick-self: #d147a3;
            --text-nick-other: #16a085;
            --text-own: #000000;
            --border-color: #cccccc;
            --user-list-bg: #f8f8f8;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #000088;
            --bg-secondary-hover: #0000aa;
            --text-primary: #cccccc;
            --text-secondary: #ffffff;
            --text-system: #0088ff;
            --text-error: #ff0000;
            --text-join: #00ff00;
            --text-highlight: #ffff00;
            --text-time: #888888;
            --text-nick-self: #ffb3d9;
            --text-nick-other: #b3e5d1;
            --text-own: #ffffff;
            --border-color: #333333;
            --user-list-bg: #000000;
        }

        * { 
            box-sizing: border-box;
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Courier New', 'Liberation Mono', monospace; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            height: 100vh;
            font-size: 14px;
            line-height: 1.0;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .irssi-terminal {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .chat-area {
            flex: 1;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: pre-wrap;
            font-family: inherit;
        }
        
        .user-list {
            width: 200px;
            background: var(--user-list-bg);
            border-left: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        /* Default state: hidden on mobile, visible on desktop */
        .user-list {
            display: none;
        }
        
        .user-list.visible {
            display: block !important;
        }
        
        /* Desktop: show by default unless explicitly hidden */
        @media (min-width: 1200px) {
            .user-list:not(.hidden) {
                display: block;
            }
            
            .user-list.hidden {
                display: none !important;
            }
        }
        
        .user-list-header {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 0 1ch;
            height: 1.2em;
            line-height: 1.2em;
            font-weight: normal;
            border-bottom: 1px solid var(--border-color);
        }
        
        .user-item {
            padding: 0 1ch;
            color: var(--text-nick-other);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .user-item.self {
            color: var(--text-nick-self);
            font-weight: bold;
        }
        
        .toggle-button {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: none;
            padding: 0 1ch;
            height: 1.2em;
            line-height: 1.2em;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            margin-left: auto;
            transition: background-color 0.2s ease;
        }
        
        .toggle-button:hover {
            background: var(--bg-secondary-hover);
        }
        
        .theme-selector {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: none;
            padding: 0 0.5ch;
            height: 1.2em;
            line-height: 1.2em;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            margin-left: 0.5ch;
            transition: background-color 0.2s ease;
        }
        
        .theme-selector:hover {
            background: var(--bg-secondary-hover);
        }
        
        .theme-selector option {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
        
        .message {
            padding: 0 1ch;
            margin: 0;
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        /* ANSI terminal colors */
        .time { color: var(--text-time); }
        .nick-self { color: var(--text-nick-self); }
        .nick-other { color: var(--text-nick-other); }
        .text { color: var(--text-primary); }
        .text-own { color: var(--text-own); }
        .system { color: var(--text-system); }
        .error { color: var(--text-error); }
        .join-part { color: var(--text-join); }
        .highlight { color: var(--text-highlight); }
        
        .top-status-bar {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 0 1ch;
            height: 1.2em;
            line-height: 1.2em;
            font-weight: normal;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .top-status-left {
            color: var(--text-secondary);
        }
        
        .top-status-right {
            color: var(--text-secondary);
        }
        
        .about-link {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 0;
            height: 1.2em;
            line-height: 1.2em;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 1ch;
        }
        
        .about-link:hover {
            color: var(--text-primary);
        }
        
        .status-bar {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 0 1ch;
            height: 1.2em;
            line-height: 1.2em;
            font-weight: normal;
            display: flex;
            justify-content: space-between;
        }
        
        .status-left {
            color: var(--text-secondary);
        }
        
        .status-right {
            color: var(--text-primary);
        }
        
        .input-bar {
            background: var(--bg-primary);
            color: var(--text-secondary);
            padding: 0 1ch;
            height: 1.2em;
            line-height: 1.2em;
            display: flex;
            align-items: center;
        }
        
        .input-prompt {
            color: var(--text-secondary);
            white-space: pre;
        }
        
        .input-field {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            outline: none;
            padding: 0;
            margin: 0;
        }
        
        /* Hide scrollbar */
        .chat-area::-webkit-scrollbar,
        .user-list::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="irssi-terminal">
        <div class="top-status-bar">
            <div class="top-status-left" id="topStatusLeft">NIGHTWATCH Terminal</div>
            <div class="top-status-right">
                <span id="connectionStatus">[disconnected]</span>
                <button class="about-link" id="aboutLink">about</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="chat-area" id="chatArea"></div>
                        <div class="user-list" id="userList">
                <div class="user-list-header">Users</div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-left" id="statusLeft">[ #nightwatch ]</div>
            <div class="status-right">
                <span id="statusRight">[connecting]</span>
                <select class="theme-selector" id="themeSelector">
                    <option value="auto">Auto</option>
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
                <button class="toggle-button" id="toggleUsers">Users</button>
            </div>
        </div>
        
        <div class="input-bar">
            <span class="input-prompt" id="inputPrompt">[guest] </span>
            <input type="text" class="input-field" id="inputField" disabled>
        </div>
    </div>

    <script>
        class ThemeManager {
            constructor() {
                this.themes = ['auto', 'dark', 'light'];
                this.currentTheme = this.getSavedTheme();
                this.selector = null;
                this.mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                
                // Initialize theme
                this.applyTheme(this.currentTheme);
                
                // Listen for system theme changes
                this.mediaQuery.addListener(() => {
                    if (this.currentTheme === 'auto') {
                        this.applyAutoTheme();
                    }
                });
            }
            
            initSelector(selector) {
                this.selector = selector;
                this.selector.value = this.currentTheme;
                this.selector.addEventListener('change', (e) => {
                    this.setTheme(e.target.value);
                });
            }
            
            getSavedTheme() {
                return localStorage.getItem('nightwatch-theme') || 'auto';
            }
            
            saveTheme(theme) {
                localStorage.setItem('nightwatch-theme', theme);
            }
            
            setTheme(theme) {
                if (!this.themes.includes(theme)) return;
                
                this.currentTheme = theme;
                this.saveTheme(theme);
                this.applyTheme(theme);
                
                if (this.selector) {
                    this.selector.value = theme;
                }
            }
            
            applyTheme(theme) {
                const body = document.body;
                
                if (theme === 'auto') {
                    this.applyAutoTheme();
                } else {
                    body.setAttribute('data-theme', theme);
                }
            }
            
            applyAutoTheme() {
                const body = document.body;
                const prefersDark = this.mediaQuery.matches;
                body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
            
            getEffectiveTheme() {
                if (this.currentTheme === 'auto') {
                    return this.mediaQuery.matches ? 'dark' : 'light';
                }
                return this.currentTheme;
            }
        }

        class IrssiTerminal {
            constructor() {
                this.ws = null;
                this.connected = false;
                this.nickname = 'guest';
                this.channel = '#nightwatch';
                this.registered = false;
                this.userCount = 0;
                this.users = [];
                this.nickMap = {}; // Map IRC names to display names
                this.pendingNickChange = null; // Track pending nickname change
                // Show user list by default, hide only if screen too small for banner + user list
                // Large banner (~1000px) + user list (~200px) = ~1200px minimum
                this.userListVisible = window.innerWidth >= 1200;
                
                // Initialize theme manager
                this.themeManager = new ThemeManager();
                
                this.initElements();
                this.connect();
            }
            
            initElements() {
                this.chatArea = document.getElementById('chatArea');
                this.userList = document.getElementById('userList');
                this.inputField = document.getElementById('inputField');
                this.inputPrompt = document.getElementById('inputPrompt');
                this.statusLeft = document.getElementById('statusLeft');
                this.statusRight = document.getElementById('statusRight');
                this.toggleButton = document.getElementById('toggleUsers');
                this.themeSelector = document.getElementById('themeSelector');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.aboutLink = document.getElementById('aboutLink');
                
                this.inputField.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });
                
                this.toggleButton.addEventListener('click', () => {
                    this.toggleUserList();
                });
                
                this.aboutLink.addEventListener('click', () => {
                    this.showAbout();
                });
                
                // Initialize theme selector
                this.themeManager.initSelector(this.themeSelector);
                
                // Show ASCII banner and welcome messages
                this.showWelcomeBanner();
                this.updatePrompt();
                this.updateUserListVisibility();
                
                // Initialize top status
                this.connectionStatus.textContent = '[connecting]';
                
                // Update banner on window resize
                window.addEventListener('resize', () => {
                    // Clear chat area and show new banner
                    this.chatArea.innerHTML = '';
                    this.showWelcomeBanner();
                });
            }
            
            showWelcomeBanner() {
                // Check if screen can fit the large banner (roughly 88 characters wide)
                // Assume ~8-10px per character, so large banner needs ~880-1000px minimum
                const canFitLargeBanner = window.innerWidth >= 1000;
                const isMobile = !canFitLargeBanner;
                
                let banner;
                if (isMobile) {
                    // Compact banner (38 chars width)
                    banner = [
                        "░█▀█░▀█▀░█▀▀░█░█░▀█▀░█░█░█▀█░▀█▀░█▀▀░█░█",
                        "░█░█░░█░░█░█░█▀█░░█░░█▄█░█▀█░░█░░█░░░█▀█",
                        "░▀░▀░▀▀▀░▀▀▀░▀░▀░░▀░░▀░▀░▀░▀░░▀░░▀▀▀░▀░▀"
                    ];
                } else {
                    // Full desktop banner
                    banner = [
                        "███╗   ██╗██╗ ██████╗ ██╗  ██╗████████╗██╗    ██╗ █████╗ ████████╗ ██████╗██╗  ██╗",
                        "████╗  ██║██║██╔════╝ ██║  ██║╚══██╔══╝██║    ██║██╔══██╗╚══██╔══╝██╔════╝██║  ██║",
                        "██╔██╗ ██║██║██║  ███╗███████║   ██║   ██║ █╗ ██║███████║   ██║   ██║     ███████║",
                        "██║╚██╗██║██║██║   ██║██╔══██║   ██║   ██║███╗██║██╔══██║   ██║   ██║     ██╔══██║",
                        "██║ ╚████║██║╚██████╔╝██║  ██║   ██║   ╚███╔███╔╝██║  ██║   ██║   ╚██████╗██║  ██║",
                        "╚═╝  ╚═══╝╚═╝ ╚═════╝ ╚═╝  ╚═╝   ╚═╝    ╚══╝╚══╝ ╚═╝  ╚═╝   ╚═╝    ╚═════╝╚═╝  ╚═╝"
                    ];
                }
                
                banner.forEach(line => {
                    const message = document.createElement('div');
                    message.className = 'message';
                    message.innerHTML = `<span class="system">${this.escapeHtml(line)}</span>`;
                    this.chatArea.appendChild(message);
                });
                
                // Welcome messages (shorter on small screens)
                if (isMobile) {
                    this.addSystemMessage('Welcome to NIGHTWATCH');
                    this.addSystemMessage('Decentralized Mesh Network');
                    this.addSystemMessage('Off-Grid conversation');
                    this.addSystemMessage('Type /nick <name> to change nick');
                } else {
                    this.addSystemMessage('Welcome to NIGHTWATCH - Decentralized Mesh Network - Off-Grid conversation');
                    this.addSystemMessage('Type /nick <name> to change your nickname');
                }
                this.addSystemMessage('Connecting to IRC bridge...');
            }
            
            connect() {
                const wsUrl = `ws://${window.location.hostname}/ws`;
                
                try {
                    this.ws = new WebSocket(wsUrl);
                } catch (error) {
                    this.addSystemMessage(`WebSocket error: ${error.message}`);
                    return;
                }
                
                this.ws.onopen = () => {
                    this.connected = true;
                    this.updateStatus('connected');
                };
                
                this.ws.onmessage = (event) => {
                    this.handleMessage(event.data);
                };
                
                this.ws.onclose = (event) => {
                    this.connected = false;
                    this.registered = false;
                    this.updateStatus('disconnected');
                    this.inputField.disabled = true;
                    this.addSystemMessage(`Connection lost (${event.code})`);
                    this.addSystemMessage('Reconnecting in 3 seconds...');
                    
                    setTimeout(() => this.connect(), 3000);
                };
                
                this.ws.onerror = (error) => {
                    this.addSystemMessage('Connection error');
                    console.error('WebSocket error:', error);
                };
            }
            
            send(message) {
                if (this.ws && this.connected) {
                    this.ws.send(message + '\r\n');
                }
            }
            
            sendMessage() {
                const input = this.inputField.value.trim();
                if (!input || !this.connected) return;
                
                // Handle /nick command
                if (input.startsWith('/nick ')) {
                    const newNick = input.slice(6).trim();
                    if (newNick && newNick !== this.nickname) {
                        // Store that we're attempting to change to this nickname
                        this.pendingNickChange = newNick;
                        this.send(`NICK ${newNick}`);
                        this.addSystemMessage(`Attempting to change nickname to: ${newNick}`);
                    } else if (!newNick) {
                        this.addSystemMessage('Usage: /nick <new_nickname>');
                    } else {
                        this.addSystemMessage('You are already using that nickname');
                    }
                    this.inputField.value = '';
                    return;
                }
                
                // Regular chat message
                if (!this.registered) {
                    this.addSystemMessage('Not connected to IRC yet, please wait...');
                    this.inputField.value = '';
                    return;
                }
                
                this.send(`PRIVMSG ${this.channel} :${input}`);
                this.addChatMessage(this.nickname, input, true);
                this.inputField.value = '';
            }
            
            handleMessage(data) {
                const lines = data.split('\r\n').filter(line => line.trim());
                
                lines.forEach(line => {
                    if (line.includes('Welcome to the') || line.includes('001')) {
                        this.registered = true;
                        this.inputField.disabled = false;
                        this.updateStatus('active');
                        this.addSystemMessage('Registration successful');
                        
                        // Add ourselves to user list if not already there
                        if (!this.users.includes(this.nickname)) {
                            this.users.push(this.nickname);
                            this.userCount = this.users.length;
                            this.updateUserList();
                        }
                        
                        // Show join message with current nickname (guest)
                        this.addJoinPart(`${this.nickname} has joined ${this.channel}`);
                    }
                    else if (line.includes('433')) { // Nick in use
                        this.nickname = this.nickname + '_';
                        this.send(`NICK ${this.nickname}`);
                        this.addSystemMessage(`Nickname in use, trying ${this.nickname}`);
                        this.updatePrompt();
                    }
                    else if (line.includes('353')) { // Names list
                        const names = line.split(':').pop().trim().split(' ');
                        this.users = names.filter(name => name.trim() && !name.includes('.irc') && !name.includes('nightwatch'));
                        this.userCount = this.users.length;
                        this.updateStatus();
                        this.updateUserList();
                    }
                    else if (line.includes('NICK')) {
                        const match = line.match(/:([^!]+)![^:]+NICK :(.+)/);
                        if (match) {
                            const oldIrcNick = match[1];
                            const newIrcNick = match[2];
                            
                            // Check if this is our own nickname change
                            // Either we have a pending change or the old IRC nick maps to us
                            const isOurNickChange = (this.pendingNickChange && newIrcNick === this.pendingNickChange) || 
                                                   this.nickMap[oldIrcNick] === this.nickname || 
                                                   oldIrcNick === this.nickname;
                            
                            if (isOurNickChange) {
                                // This is our nickname change
                                const oldDisplayName = this.nickname;
                                this.nickname = this.pendingNickChange || newIrcNick; // Use the name we requested
                                this.pendingNickChange = null; // Clear pending change
                                
                                // Update our mapping
                                this.nickMap[newIrcNick] = this.nickname;
                                
                                this.updatePrompt();
                                this.updateUserList();
                                this.addSystemMessage(`You are now known as ${this.nickname}`);
                            } else {
                                // Update user list for other users
                                const userIndex = this.users.indexOf(oldIrcNick);
                                if (userIndex !== -1) {
                                    this.users[userIndex] = newIrcNick;
                                }
                                
                                // Update nickname mapping for other users
                                if (this.nickMap[oldIrcNick]) {
                                    this.nickMap[newIrcNick] = this.nickMap[oldIrcNick];
                                    delete this.nickMap[oldIrcNick];
                                } else {
                                    this.nickMap[newIrcNick] = newIrcNick;
                                }
                                
                                this.updateUserList();
                                this.addJoinPart(`${oldIrcNick} is now known as ${newIrcNick}`);
                            }
                        }
                    }
                    else if (line.includes('PRIVMSG')) {
                        const match = line.match(/:([^!]+)![^:]+PRIVMSG [^:]+:(.+)/);
                        if (match && match[1] !== this.nickname) {
                            const nick = match[1];
                            const message = match[2];
                            
                            // Handle CTCP ACTION (/me)
                            if (message.startsWith('\x01ACTION') && message.endsWith('\x01')) {
                                const action = message.slice(8, -1);
                                this.addAction(nick, action);
                            } else {
                                this.addChatMessage(nick, message, false);
                            }
                        }
                    }
                    else if (line.startsWith('PING')) {
                        this.send(line.replace('PING', 'PONG'));
                    }
                });
            }
            
            getTime() {
                const now = new Date();
                return String(now.getHours()).padStart(2, '0') + ':' + 
                       String(now.getMinutes()).padStart(2, '0');
            }
            
            addChatMessage(nick, text, isOwnMessage) {
                const time = this.getTime();
                const nickClass = isOwnMessage ? 'nick-self' : 'nick-other';
                const textClass = isOwnMessage ? 'text-own' : 'text';
                
                const message = document.createElement('div');
                message.className = 'message';
                message.innerHTML = `<span class="time">${time}</span> <span class="${nickClass}">&lt;${this.escapeHtml(nick)}&gt;</span> <span class="${textClass}">${this.escapeHtml(text)}</span>`;
                
                this.chatArea.appendChild(message);
                this.scrollToBottom();
            }
            
            addAction(nick, action) {
                const time = this.getTime();
                
                const message = document.createElement('div');
                message.className = 'message';
                message.innerHTML = `<span class="time">${time}</span> <span class="nick-other">* ${this.escapeHtml(nick)}</span> <span class="text">${this.escapeHtml(action)}</span>`;
                
                this.chatArea.appendChild(message);
                this.scrollToBottom();
            }
            
            addSystemMessage(text) {
                const time = this.getTime();
                
                const message = document.createElement('div');
                message.className = 'message';
                message.innerHTML = `<span class="time">${time}</span> <span class="system">-!- ${this.escapeHtml(text)}</span>`;
                
                this.chatArea.appendChild(message);
                this.scrollToBottom();
            }
            
            addJoinPart(text) {
                const time = this.getTime();
                
                const message = document.createElement('div');
                message.className = 'message';
                message.innerHTML = `<span class="time">${time}</span> <span class="join-part">-!- ${this.escapeHtml(text)}</span>`;
                
                this.chatArea.appendChild(message);
                this.scrollToBottom();
            }
            
            updatePrompt() {
                this.inputPrompt.textContent = `[${this.nickname}] `;
            }
            
            toggleUserList() {
                this.userListVisible = !this.userListVisible;
                this.updateUserListVisibility();
            }
            
            updateUserListVisibility() {
                if (this.userListVisible) {
                    this.userList.classList.add('visible');
                    this.userList.classList.remove('hidden');
                    this.toggleButton.textContent = 'Hide Users';
                } else {
                    this.userList.classList.remove('visible');
                    this.userList.classList.add('hidden');
                    this.toggleButton.textContent = 'Show Users';
                }
            }
            
            updateUserList() {
                // Clear existing users (except header)
                const header = this.userList.querySelector('.user-list-header');
                this.userList.innerHTML = '';
                this.userList.appendChild(header);
                
                // Create a list of display names
                const displayUsers = [];
                
                // Always include ourselves with our display name
                if (!displayUsers.includes(this.nickname)) {
                    displayUsers.push(this.nickname);
                }
                
                // Add other users, using display names if we have them
                this.users.forEach(ircUser => {
                    const displayName = this.nickMap[ircUser] || ircUser;
                    // Skip IRC-assigned names that look like webuser123
                    if (!ircUser.startsWith('webuser') && !displayUsers.includes(displayName) && displayName !== this.nickname) {
                        displayUsers.push(displayName);
                    }
                });
                
                // Sort users with self first
                displayUsers.sort((a, b) => {
                    if (a === this.nickname) return -1;
                    if (b === this.nickname) return 1;
                    return a.localeCompare(b);
                });
                
                // Add user elements
                displayUsers.forEach(user => {
                    const userEl = document.createElement('div');
                    userEl.className = 'user-item';
                    if (user === this.nickname) {
                        userEl.classList.add('self');
                    }
                    userEl.textContent = user;
                    this.userList.appendChild(userEl);
                });
                
                this.userCount = displayUsers.length;
            }
            
            updateStatus(connectionStatus = null) {
                if (connectionStatus) {
                    this.statusRight.textContent = `[${connectionStatus}]`;
                    this.connectionStatus.textContent = `[${connectionStatus}]`;
                }
                
                if (this.registered && this.userCount > 0) {
                    this.statusRight.textContent = `[users: ${this.userCount}]`;
                    this.connectionStatus.textContent = `[connected]`;
                }
            }
            
            showAbout() {
                const aboutText = [
                    "╔════════════════════════════════════════════════════════════════════╗",
                    "║                            NIGHTWATCH                             ║",
                    "║                    Decentralized Mesh Network                     ║",
                    "║                                                                    ║",
                    "║  A resilient chat system designed for off-grid communication      ║",
                    "║  using Batman Advanced mesh networking protocol.                   ║",
                    "║                                                                    ║",
                    "║  Features:                                                         ║",
                    "║  • Zero-infrastructure messaging                                   ║",
                    "║  • Automatic node discovery                                        ║",
                    "║  • Self-healing network topology                                   ║",
                    "║  • Terminal-style interface                                        ║",
                    "║                                                                    ║",
                    "║  Commands:                                                         ║",
                    "║  /nick <name>  - Change your nickname                             ║",
                    "║                                                                    ║",
                    "║  Built with love for decentralized communication                  ║",
                    "╚════════════════════════════════════════════════════════════════════╝"
                ];
                
                aboutText.forEach(line => {
                    const message = document.createElement('div');
                    message.className = 'message';
                    message.innerHTML = `<span class="system">${this.escapeHtml(line)}</span>`;
                    this.chatArea.appendChild(message);
                });
                
                this.scrollToBottom();
            }
            
            scrollToBottom() {
                this.chatArea.scrollTop = this.chatArea.scrollHeight;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', () => {
            new IrssiTerminal();
        });
    </script>
