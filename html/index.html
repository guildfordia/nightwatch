<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nightwatch</title>
  <style>
    :root {
      --vh: 1vh; /* updated by JS for mobile browsers */
      --bg-primary: #000000;
      --bg-secondary: #000088;
      --bg-secondary-hover: #0000aa;
      --text-primary: #cccccc;
      --text-secondary: #ffffff;
      --text-system: #0088ff;
      --text-error: #ff0000;
      --text-join: #00ff00;
      --text-highlight: #ffff00;
      --text-time: #888888;
      --text-nick-self: #ffb3d9;
      --text-nick-other: #b3e5d1;
      --text-own: #ffffff;
      --border-color: #333333;
      --user-list-bg: #000000;
    }
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #e6e6fa;
      --bg-secondary-hover: #d0d0d0;
      --text-primary: #333333;
      --text-secondary: #000000;
      --text-system: #0066cc;
      --text-error: #cc0000;
      --text-join: #008800;
      --text-highlight: #cc6600;
      --text-time: #666666;
      --text-nick-self: #d147a3;
      --text-nick-other: #16a085;
      --text-own: #000000;
      --border-color: #cccccc;
      --user-list-bg: #f8f8f8;
    }
    /* dark theme is the :root default — no separate [data-theme="dark"] needed */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', 'Liberation Mono', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      /* Use real visual viewport on mobile — never exceed it */
      height: calc(var(--vh) * 100);
      max-height: calc(var(--vh) * 100);
      font-size: 14px;
      line-height: 1.0;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .irssi-terminal {
      height: calc(var(--vh) * 100);
      max-height: calc(var(--vh) * 100);
      display: flex;
      flex-direction: column;
    }

    .top-status-bar {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 1ch;
      overflow: hidden;
      white-space: nowrap;
    }
    .top-status-left { color: var(--text-secondary); display: flex; gap: 1ch; align-items: center; }
    .top-status-right { color: var(--text-secondary); display: flex; gap: 1ch; align-items: center; }
    .top-status-bar .mesh-info { opacity: 0.85; }
    .top-status-bar .node-label { font-weight: bold; }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden; /* contain child overflows */
      min-height: 0; /* allow flex children to shrink properly */
    }

    .chat-area {
      flex: 1;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      overflow-y: auto; /* scroll here */
      overflow-x: hidden;
      white-space: pre-wrap;
      font-family: inherit;
    }

    .user-list {
      width: 200px;
      background: var(--user-list-bg);
      border-left: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0;
      overflow-y: auto;
      flex-shrink: 0;
      display: none; /* hidden by default on small screens */
    }
    .user-list.visible { display: block !important; }
    @media (min-width: 1200px) {
      .user-list:not(.hidden) { display: block; }
      .user-list.hidden { display: none !important; }
    }
    .user-list-header {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      border-bottom: 1px solid var(--border-color);
    }
    .user-item {
      padding: 0 1ch;
      color: var(--text-nick-other);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-item.self { color: var(--text-nick-self); font-weight: bold; }

    .toggle-button,
    .about-link,
    .theme-selector {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: none;
      height: 1.2em;
      line-height: 1.2em;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }
    .toggle-button { padding: 0 1ch; margin-left: auto; }
    .toggle-button:hover { background: var(--bg-secondary-hover); }
    .toggle-button:focus-visible,
    .about-link:focus-visible,
    .theme-selector:focus-visible { outline: 2px solid var(--text-system); outline-offset: 1px; }
    .toggle-button:focus:not(:focus-visible),
    .about-link:focus:not(:focus-visible),
    .theme-selector:focus:not(:focus-visible) { outline: none; }
    .about-link { background: transparent; text-decoration: underline; padding: 0; }
    .about-link:hover { color: var(--text-primary); }
    .theme-selector { padding: 0 0.5ch; margin-left: 0.5ch; }
    .theme-selector option { background: var(--bg-secondary); color: var(--text-secondary); }

    .status-bar {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      min-height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5ch;
      flex-shrink: 0;
    }
    .status-left { color: var(--text-secondary); }
    .status-right { color: var(--text-primary); display: flex; flex-wrap: wrap; align-items: center; gap: 0.5ch; }

    .message { padding: 0 1ch; display: block; white-space: pre-wrap; word-wrap: break-word; }
    .time { color: var(--text-time); }
    .nick-self { color: var(--text-nick-self); }
    .nick-other { color: var(--text-nick-other); }
    .text { color: var(--text-primary); }
    .text-own { color: var(--text-own); }
    .system { color: var(--text-system); }
    .error { color: var(--text-error); }
    .join-part { color: var(--text-join); }
    .highlight { color: var(--text-highlight); }

    .input-bar {
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 0.5em 1ch;
      min-height: 2.4em;
      line-height: 1.4em;
      display: flex;
      align-items: center;
      gap: 0.5ch;
      border-top: 1px solid var(--text-system);
      flex-shrink: 0;
      padding-bottom: calc(0.5em + env(safe-area-inset-bottom));
    }
    .input-prompt { color: var(--text-system); white-space: pre; font-weight: bold; }
    .input-field {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      outline: none;
      padding: 0.2em 0.5ch;
      margin: 0;
      /* mobile typing niceties */
      -webkit-appearance: none;
      -webkit-text-size-adjust: 100%;
      caret-color: var(--text-secondary);
      touch-action: manipulation;
    }

    .chat-area::-webkit-scrollbar,
    .user-list::-webkit-scrollbar { width: 0px; background: transparent; }

    @media (max-width: 600px) {
      .status-bar { flex-direction: column; align-items: stretch; gap: 0; }
      .status-left, .status-right { justify-content: center; padding: 0.1em 0; }
      .status-right { justify-content: center; flex-wrap: wrap; }
    }
    @media (max-width: 800px) and (min-width: 601px) {
      .status-bar { gap: 0.25ch; }
      .status-right { gap: 0.25ch; }
    }
  </style>
</head>
<body>
  <div class="irssi-terminal">
    <div class="top-status-bar">
      <div class="top-status-left" id="topStatusLeft">
        <span class="node-label" id="nodeLabel">NIGHTWATCH</span>
        <span class="mesh-info" id="meshInfo"></span>
      </div>
      <div class="top-status-right">
        <span class="mesh-info" id="meshStats"></span>
        <span id="connectionStatus">[disconnected]</span>
        <button class="about-link" id="aboutLink">about</button>
      </div>
    </div>

    <div class="main-content">
      <div class="chat-area" id="chatArea"></div>
      <div class="user-list" id="userList">
        <div class="user-list-header">Users</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left" id="statusLeft">[ #nightwatch ]</div>
      <div class="status-right">
        <span id="statusRight">[connecting]</span>
        <select class="theme-selector" id="themeSelector">
          <option value="auto">Auto</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
        <button class="toggle-button" id="toggleUsers">Users</button>
      </div>
    </div>

    <div class="input-bar">
      <span class="input-prompt" id="inputPrompt">[connecting...] </span>
      <input type="text" class="input-field" id="inputField" aria-labelledby="inputPrompt" disabled />
    </div>
  </div>

  <script>
    // Visual viewport fix for mobile (keeps input bar visible when keyboard opens)
    function setRealVh() {
      const vh = window.visualViewport ? window.visualViewport.height * 0.01 : window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      // On iOS, the visual viewport may scroll — reset to top
      if (window.visualViewport && window.visualViewport.offsetTop > 0) {
        window.scrollTo(0, 0);
      }
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', () => { setTimeout(setRealVh, 100); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setRealVh);
      window.visualViewport.addEventListener('scroll', () => { window.scrollTo(0, 0); });
    }
    // Prevent iOS from scrolling the page when focusing the input
    document.addEventListener('focusin', (e) => {
      if (e.target.classList.contains('input-field')) {
        setTimeout(() => { window.scrollTo(0, 0); setRealVh(); }, 100);
      }
    });

    class ThemeManager {
      constructor() {
        this.themes = ['auto', 'dark', 'light'];
        this.currentTheme = this.getSavedTheme();
        this.selector = null;
        this.mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        this.applyTheme(this.currentTheme);
        this.mediaQuery.addEventListener('change', () => {
          if (this.currentTheme === 'auto') this.applyAutoTheme();
        });
      }
      initSelector(selector) {
        this.selector = selector;
        this.selector.value = this.currentTheme;
        this.selector.addEventListener('change', (e) => this.setTheme(e.target.value));
      }
      getSavedTheme() { try { return localStorage.getItem('nightwatch-theme') || 'auto'; } catch(e) { return 'auto'; } }
      saveTheme(theme) { try { localStorage.setItem('nightwatch-theme', theme); } catch(e) {} }
      setTheme(theme) {
        if (!this.themes.includes(theme)) return;
        this.currentTheme = theme;
        this.saveTheme(theme);
        this.applyTheme(theme);
        if (this.selector) this.selector.value = theme;
      }
      applyTheme(theme) { theme === 'auto' ? this.applyAutoTheme() : document.body.setAttribute('data-theme', theme); }
      applyAutoTheme() {
        const prefersDark = this.mediaQuery.matches;
        document.body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
      getEffectiveTheme() { return this.currentTheme === 'auto' ? (this.mediaQuery.matches ? 'dark' : 'light') : this.currentTheme; }
    }

    class IrssiTerminal {
      constructor() {
        this.ws = null;
        this.connected = false;
        this.nickname = 'connecting...';
        this.savedNick = (() => { try { return localStorage.getItem('nightwatch-nick'); } catch(e) { return null; } })();
        this.channel = '#nightwatch';
        this.registered = false;
        this.userCount = 0;
        this.users = [];
        this.nickMap = {};
        this.pendingNickChange = null;
        this.userListVisible = window.innerWidth >= 1200;
        this.bannerRendered = false; // prevent re-render on resize
        this.reconnectDelay = 1000; // start at 1s, exponential backoff
        this.maxReconnectDelay = 30000; // cap at 30s
        this.reconnectTimer = null;
        this.wsBuffer = ''; // buffer for partial WebSocket frames

        this.themeManager = new ThemeManager();
        // Debug state for live status bar
        this.debugData = null;
        this.bridgeData = null;
        this.knownPeers = new Set(); // track discovered peers for join/leave announcements
        this.initElements();
        this.connect();
        this.startDebugPolling();
      }

      initElements() {
        this.chatArea = document.getElementById('chatArea');
        this.userList = document.getElementById('userList');
        this.inputField = document.getElementById('inputField');
        this.inputPrompt = document.getElementById('inputPrompt');
        this.statusLeft = document.getElementById('statusLeft');
        this.statusRight = document.getElementById('statusRight');
        this.toggleButton = document.getElementById('toggleUsers');
        this.themeSelector = document.getElementById('themeSelector');
        this.connectionStatus = document.getElementById('connectionStatus');
        this.nodeLabel = document.getElementById('nodeLabel');
        this.meshInfo = document.getElementById('meshInfo');
        this.meshStats = document.getElementById('meshStats');
        this.aboutLink = document.getElementById('aboutLink');

        this.inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') this.sendMessage(); });
        this.toggleButton.addEventListener('click', () => this.toggleUserList());
        this.aboutLink.addEventListener('click', () => this.showAbout());

        this.themeManager.initSelector(this.themeSelector);

        this.showWelcomeBanner();  // render once
        this.updatePrompt();
        this.updateUserListVisibility();
        this.connectionStatus.textContent = '[connecting]';
      }

      showWelcomeBanner() {
        if (this.bannerRendered) return;
        this.bannerRendered = true;

        const userListWidth = 200;
        const smallBannerWidth = 38 * 9;
        const largeBannerWidth = 88 * 9;
        const canFitLargeBanner = window.innerWidth >= 1000;
        const canFitSmallBannerWithUserList = window.innerWidth >= (smallBannerWidth + userListWidth);

        let banner = null;
        let isMobile = false;

        if (canFitLargeBanner) {
          banner = [
            "███╗   ██╗██╗ ██████╗ ██╗  ██╗████████╗██╗    ██╗ █████╗ ████████╗ ██████╗██╗  ██╗",
            "████╗  ██║██║██╔════╝ ██║  ██║╚══██╔══╝██║    ██║██╔══██╗╚══██╔══╝██╔════╝██║  ██║",
            "██╔██╗ ██║██║██║  ███╗███████║   ██║   ██║ █╗ ██║███████║   ██║   ██║     ███████║",
            "██║╚██╗██║██║██║   ██║██╔══██║   ██║   ██║███╗██║██╔══██║   ██║   ██║     ██╔══██║",
            "██║ ╚████║██║╚██████╔╝██║  ██║   ██║   ╚███╔███╔╝██║  ██║   ██║   ╚██████╗██║  ██║",
            "╚═╝  ╚═══╝╚═╝ ╚═════╝ ╚═╝  ╚═╝   ╚═╝    ╚══╝╚══╝ ╚═╝  ╚═╝   ╚═╝    ╚═════╝╚═╝  ╚═╝"
          ];
        } else if (canFitSmallBannerWithUserList) {
          banner = [
            "░█▀█░▀█▀░█▀▀░█░█░▀█▀░█░█░█▀█░▀█▀░█▀▀░█░█",
            "░█░█░░█░░█░█░█▀█░░█░░█▄█░█▀█░░█░░█░░░█▀█",
            "░▀░▀░▀▀▀░▀▀▀░▀░▀░░▀░░▀░▀░▀░▀░░▀░░▀▀▀░▀░▀"
          ];
          isMobile = true;
        }

        if (banner) {
          banner.forEach(line => this.appendSystemLine(line));
        }

        if (!banner || isMobile) {
          this.addSystemMessage('Welcome to NIGHTWATCH');
          this.addSystemMessage('Decentralized Mesh Network');
          this.addSystemMessage('Off-Grid conversation');
          this.addSystemMessage('Type /help for commands');
        } else {
          this.addSystemMessage('Welcome to NIGHTWATCH - Decentralized Mesh Network - Off-Grid conversation');
          this.addSystemMessage('Type /help for commands, /debug for diagnostics');
        }
        this.addSystemMessage('Connecting to IRC bridge...');
      }

      connect() {
        // Cancel any pending reconnect timer to prevent duplicate connection attempts
        if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }

        // Clean up old WebSocket before creating a new one to prevent the old
        // onclose handler from firing and triggering a duplicate reconnect cascade.
        if (this.ws) {
          this.ws.onclose = null;
          this.ws.onerror = null;
          this.ws.onmessage = null;
          this.ws.onopen = null;
          if (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING) {
            this.ws.close();
          }
          this.ws = null;
        }

        const wsHost = window.location.port ? `${window.location.hostname}:${window.location.port}` : window.location.hostname;
        // Pass saved nick so the bridge registers with it directly (avoids zombie nick conflicts)
        const nickParam = this.savedNick ? `?nick=${encodeURIComponent(this.savedNick)}` : '';
        const wsUrl = `ws://${wsHost}/ws${nickParam}`;
        try { this.ws = new WebSocket(wsUrl); }
        catch (error) { this.addSystemMessage(`WebSocket error: ${error.message}`); return; }

        this.ws.onopen = () => {
          this.connected = true;
          this.wsBuffer = ''; // reset partial-frame buffer on new connection
          this.reconnectDelay = 1000; // reset backoff on successful connect
          this.updateStatus('connected');
        };
        this.ws.onmessage = (event) => this.handleMessage(event.data);
        this.ws.onclose = (event) => {
          this.connected = false;
          this.registered = false;
          // Clear stale state so reconnect starts with a clean slate
          this.users = [];
          this.nickMap = {};
          this.pendingNickChange = null;
          this.userCount = 0;
          this.updateUserList();
          this.updateStatus('disconnected');
          this.inputField.disabled = true;
          const delaySec = (this.reconnectDelay / 1000).toFixed(0);
          this.addSystemMessage(`Connection lost (${event.code}). Reconnecting in ${delaySec}s...`);
          // Cancel any pending reconnect to prevent pile-up (e.g., browser
          // backgrounded then foregrounded queuing multiple timers at once)
          if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
          this.reconnectTimer = setTimeout(() => { this.reconnectTimer = null; this.connect(); }, this.reconnectDelay);
          this.reconnectDelay = Math.min(this.reconnectDelay * 2, this.maxReconnectDelay);
        };
        this.ws.onerror = () => { this.addSystemMessage('Connection error'); };
      }

      send(line) { if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(line + '\r\n'); }

      sendMessage() {
        const input = this.inputField.value.trim();
        if (!input || !this.connected) return;

        // Enforce max message length client-side to avoid wasting bandwidth
        // on the low-bandwidth mesh (backend truncates at 400 chars anyway)
        const MAX_MSG_LEN = 400;
        if (!input.startsWith('/') && input.length > MAX_MSG_LEN) {
          this.addSystemMessage(`Message too long (${input.length}/${MAX_MSG_LEN} chars)`);
          return;
        }

        if (input.startsWith('/nick ')) {
          const newNick = input.slice(6).trim();
          // Validate nick client-side (matches server-side isValidIRCNick rules)
          const nickRe = /^[A-Za-z_\-\[\]\\`\^{}][A-Za-z0-9_\-\[\]\\`\^{}]{0,15}$/;
          if (newNick && !nickRe.test(newNick)) {
            this.addSystemMessage('Invalid nickname. Use letters, digits, - _ [ ] \\ ` ^ { } (max 16 chars, must start with a letter or special char)');
            this.inputField.value = '';
            return;
          }
          if (newNick && newNick !== this.nickname) {
            this.pendingNickChange = newNick;
            this.send(`NICK ${newNick}`);
            this.addSystemMessage(`Attempting to change nickname to: ${newNick}`);
          } else if (!newNick) {
            this.addSystemMessage('Usage: /nick <new_nickname>');
          } else {
            this.addSystemMessage('You are already using that nickname');
          }
          this.inputField.value = '';
          return;
        }

        if (input === '/debug' || input === '/status') {
          this.inputField.value = '';
          this.showDebugInfo();
          return;
        }

        if (input === '/nodes' || input === '/mesh') {
          this.inputField.value = '';
          this.showNodesInfo();
          return;
        }

        if (input === '/help') {
          this.inputField.value = '';
          this.addSystemMessage('Commands:');
          this.addSystemMessage('  /nick <name>  - Change your nickname');
          this.addSystemMessage('  /nodes        - Show mesh network map');
          this.addSystemMessage('  /debug        - Show full node diagnostics');
          this.addSystemMessage('  /help         - Show this help');
          return;
        }

        if (!this.registered) {
          this.addSystemMessage('Not connected to IRC yet, please wait...');
          this.inputField.value = '';
          return;
        }

        this.send(`PRIVMSG ${this.channel} :${input}`);
        this.addChatMessage(this.nickname, input, true);
        this.inputField.value = '';
      }

      handleMessage(data) {
        // Buffer partial frames: IRC lines are \r\n-terminated, but a WebSocket
        // message may split mid-line. Accumulate in wsBuffer and only process
        // complete lines (those followed by \r\n or \n).
        this.wsBuffer += data;
        // Prevent unbounded buffer growth from a misbehaving server
        if (this.wsBuffer.length > 10000) {
          this.addSystemMessage('Buffer overflow — resetting connection');
          this.wsBuffer = '';
          this.ws.close();
          return;
        }
        const parts = this.wsBuffer.split(/\r?\n/);
        // Last element is either '' (data ended with \n) or an incomplete line
        this.wsBuffer = parts.pop();
        const lines = parts.filter(line => line.trim());
        lines.forEach(line => {
          // RPL_WELCOME — extract real nick from ":server 001 <nick> :Welcome..."
          if (line.includes(' 001 ')) {
            const parts = line.split(' ');
            const idx001 = parts.indexOf('001');
            if (idx001 !== -1 && parts[idx001 + 1]) {
              this.nickname = parts[idx001 + 1];
              // Always persist nick so reconnections reuse it
              this.savedNick = this.nickname;
              try { localStorage.setItem('nightwatch-nick', this.nickname); } catch(e) {}
              this.updatePrompt();
            }
            this.registered = true;
            this.inputField.disabled = false;
            this.updateStatus('active');
            this.addSystemMessage(`Connected as ${this.nickname}`);
            // Join channel and request user list — NAMES will populate users
            this.send(`JOIN ${this.channel}`);
            this.send(`NAMES ${this.channel}`);
          }
          // Nickname in use
          else if (line.includes(' 433 ')) {
            this.nickname = this.nickname + '_';
            this.send(`NICK ${this.nickname}`);
            this.savedNick = this.nickname;
            try { localStorage.setItem('nightwatch-nick', this.nickname); } catch(e) {}
            this.addSystemMessage(`Nickname in use, trying ${this.nickname}`);
            this.updatePrompt();
          }
          // Names list
          else if (line.includes(' 353 ')) {
            // RPL_NAMREPLY: ":server 353 nick = #channel :name1 name2 ..."
            // Use regex to extract the name list after the channel name,
            // avoiding fragile split(':') which breaks if channel contains ':'
            const namesMatch = line.match(/ 353 [^ ]+ [=*@] [^ ]+ :(.+)/);
            const names = (namesMatch ? namesMatch[1] : line.split(':').pop()).trim().split(' ')
              .map(name => name.replace(/^[@+~&%]/, '')) // strip IRC prefix chars
              .filter(name => name.trim() && !name.includes('.irc'));
            this.users = names;
            this.userCount = this.users.length;
            this.updateStatus();
            this.updateUserList();
          }
          // Nick changes
          else if (line.includes(' NICK :')) {
            const match = line.match(/:([^!]+)![^:]+NICK :(.+)/);
            if (match) {
              const oldIrcNick = match[1];
              const newIrcNick = match[2];
              const isOurNickChange =
                (this.pendingNickChange && newIrcNick === this.pendingNickChange) ||
                this.nickMap[oldIrcNick] === this.nickname ||
                oldIrcNick === this.nickname;

              if (isOurNickChange) {
                this.nickname = this.pendingNickChange || newIrcNick;
                this.pendingNickChange = null;
                // Update users array: replace old IRC nick with new one
                const ownIdx = this.users.indexOf(oldIrcNick);
                if (ownIdx !== -1) this.users[ownIdx] = newIrcNick;
                this.nickMap[newIrcNick] = this.nickname;
                delete this.nickMap[oldIrcNick];
                // Persist custom nick for reconnections
                try { localStorage.setItem('nightwatch-nick', this.nickname); } catch(e) {}
                this.updatePrompt();
                this.updateUserList();
                // Re-request NAMES to get a clean user list from server
                this.send(`NAMES ${this.channel}`);
                this.addSystemMessage(`You are now known as ${this.nickname}`);
              } else {
                const idx = this.users.indexOf(oldIrcNick);
                if (idx !== -1) this.users[idx] = newIrcNick;
                if (this.nickMap[oldIrcNick]) {
                  this.nickMap[newIrcNick] = this.nickMap[oldIrcNick];
                  delete this.nickMap[oldIrcNick];
                } else {
                  this.nickMap[newIrcNick] = newIrcNick;
                }
                this.updateUserList();
                this.addJoinPart(`${oldIrcNick} is now known as ${newIrcNick}`);
              }
            }
          }
          // JOIN — add user to list
          else if (line.includes(' JOIN ')) {
            const match = line.match(/:([^!]+)![^ ]+ JOIN/);
            if (match) {
              const nick = match[1];
              if (!this.users.includes(nick)) {
                this.users.push(nick);
                this.userCount = this.users.length;
                this.updateUserList();
              }
              // Don't show "joined" for ourselves — "Connected as X" is enough
              if (nick !== this.nickname) {
                this.addJoinPart(`${nick} has joined ${this.channel}`);
              }
            }
          }
          // PART — remove user from list
          else if (line.includes(' PART ')) {
            const match = line.match(/:([^!]+)![^ ]+ PART/);
            if (match) {
              const nick = match[1];
              this.users = this.users.filter(u => u !== nick);
              this.userCount = this.users.length;
              this.updateUserList();
              this.addJoinPart(`${nick} has left ${this.channel}`);
            }
          }
          // QUIT — remove user from list
          else if (line.includes(' QUIT ')) {
            const match = line.match(/:([^!]+)![^ ]+ QUIT/);
            if (match) {
              const nick = match[1];
              this.users = this.users.filter(u => u !== nick);
              delete this.nickMap[nick];
              this.userCount = this.users.length;
              this.updateUserList();
              const reasonMatch = line.match(/ QUIT :(.*)$/);
              const reason = reasonMatch ? reasonMatch[1] : '';
              this.addJoinPart(`${nick} has quit${reason ? ` (${reason})` : ''}`);
            }
          }
          // PRIVMSG & CTCP ACTION
          else if (line.includes(' PRIVMSG ')) {
            const match = line.match(/:([^!]+)![^:]+PRIVMSG [^:]+:(.*)/);
            // Filter own messages: check both IRC nick and display nick
            // (after /nick, the IRC server may echo back our message with
            // the new IRC nick before the NICK confirmation arrives)
            const isOwnMsg = match && (
              match[1] === this.nickname ||
              this.nickMap[match[1]] === this.nickname ||
              (this.pendingNickChange && match[1] === this.pendingNickChange)
            );
            if (match && !isOwnMsg) {
              const nick = match[1];
              const message = match[2];
              if (message.startsWith('\x01ACTION') && message.endsWith('\x01')) {
                const action = message.slice(8, -1);
                this.addAction(nick, action);
              } else {
                this.addChatMessage(nick, message, false);
              }
            }
          }
          // PING -> PONG
          else if (line.startsWith('PING')) {
            this.send(line.replace('PING', 'PONG'));
          }
        });
      }

      getTime() {
        const now = new Date();
        return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      }

      appendSystemLine(text) {
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="system">${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
      }

      addChatMessage(nick, text, isOwn) {
        const time = this.getTime();
        const nickClass = isOwn ? 'nick-self' : 'nick-other';
        const textClass = isOwn ? 'text-own' : 'text';
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="${nickClass}">&lt;${this.escapeHtml(nick)}&gt;</span> <span class="${textClass}">${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addAction(nick, action) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="nick-other">* ${this.escapeHtml(nick)}</span> <span class="text">${this.escapeHtml(action)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addSystemMessage(text) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="system">-!- ${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addJoinPart(text) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="join-part">-!- ${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      updatePrompt() { this.inputPrompt.textContent = `[${this.nickname}] `; }

      toggleUserList() {
        this.userListVisible = !this.userListVisible;
        this.updateUserListVisibility();
      }
      updateUserListVisibility() {
        if (this.userListVisible) {
          this.userList.classList.add('visible');
          this.userList.classList.remove('hidden');
          this.toggleButton.textContent = 'Hide Users';
        } else {
          this.userList.classList.remove('visible');
          this.userList.classList.add('hidden');
          this.toggleButton.textContent = 'Show Users';
        }
      }

      updateUserList() {
        const header = this.userList.querySelector('.user-list-header');
        if (!header) return;
        // Remove all children except header (innerHTML='' would detach the header ref)
        while (this.userList.lastChild && this.userList.lastChild !== header) {
          this.userList.removeChild(this.userList.lastChild);
        }

        const displayUsers = new Set();

        this.users.forEach(ircUser => {
          // Filter out IRC server names, keep all real users (including webuser*)
          if (!ircUser.includes('.irc')) {
            const displayName = this.nickMap[ircUser] || ircUser;
            displayUsers.add(displayName);
          }
        });

        const sorted = [...displayUsers].sort((a, b) =>
          a === this.nickname ? -1 : b === this.nickname ? 1 : a.localeCompare(b)
        );

        sorted.forEach(user => {
          const el = document.createElement('div');
          el.className = 'user-item';
          if (user === this.nickname) el.classList.add('self');
          el.textContent = user;
          this.userList.appendChild(el);
        });

        this.userCount = sorted.length;
        header.textContent = `Users (${this.userCount})`;
      }

      updateStatus(connectionStatus = null) {
        if (connectionStatus) {
          this.statusRight.textContent = `[${connectionStatus}]`;
          this.connectionStatus.textContent = `[${connectionStatus}]`;
        }
        if (this.registered && this.userCount > 0) {
          this.statusRight.textContent = `[users: ${this.userCount}]`;
          this.connectionStatus.textContent = `[connected]`;
        }
      }

      async showDebugInfo() {
        this.addSystemMessage('Collecting debug info...');
        const sep = '─'.repeat(50);

        // Fetch both endpoints in parallel
        const [debugRes, bridgeRes] = await Promise.allSettled([
          fetch('/api/debug').then(r => r.ok ? r.json() : null).catch(() => null),
          fetch('/api/bridge-status').then(r => r.ok ? r.json() : null).catch(() => null)
        ]);

        const debug = debugRes.status === 'fulfilled' ? debugRes.value : null;
        const bridge = bridgeRes.status === 'fulfilled' ? bridgeRes.value : null;

        this.appendSystemLine('');
        this.appendSystemLine(`${sep}`);
        this.appendSystemLine('  NIGHTWATCH DEBUG INFO');
        this.appendSystemLine(`${sep}`);

        // ---- Node info ----
        if (debug && debug.node) {
          const n = debug.node;
          this.appendSystemLine('');
          this.appendSystemLine('  NODE');
          this.appendSystemLine(`    Hostname:    ${n.hostname}`);
          if (n.model) this.appendSystemLine(`    Model:       ${n.model}`);
          this.appendSystemLine(`    Node #:      ${n.number}`);
          this.appendSystemLine(`    Mesh IP:     ${n.mesh_ip}`);
          this.appendSystemLine(`    Gateway:     ${n.gateway}`);
          this.appendSystemLine(`    Uptime:      ${n.uptime}`);
        }

        // ---- System resources ----
        if (debug && debug.system) {
          const s = debug.system;
          this.appendSystemLine('');
          this.appendSystemLine('  SYSTEM');
          this.appendSystemLine(`    Memory:      ${s.memory_available_mb}MB free / ${s.memory_total_mb}MB total`);
          this.appendSystemLine(`    CPU temp:    ${s.cpu_temp_c}°C`);
          this.appendSystemLine(`    Disk:        ${s.disk_usage_pct}% used`);
        }

        // ---- Mesh ----
        if (debug && debug.mesh) {
          const m = debug.mesh;
          this.appendSystemLine('');
          this.appendSystemLine('  MESH INTERFACE');
          this.appendSystemLine(`    Interface:   ${m.interface}`);
          this.appendSystemLine(`    Mode:        ${m.type}`);
          if (m.channel) this.appendSystemLine(`    Channel:     ${m.channel}`);

          if (m.stations && m.stations.length > 0) {
            this.appendSystemLine(`    Stations:    ${m.stations.length} peer(s)`);
            m.stations.forEach(s => {
              const signal = s.signal ? ` (${s.signal} dBm)` : '';
              const plink = s.plink ? ` [${s.plink}]` : '';
              this.appendSystemLine(`      ${s.mac}${signal}${plink}`);
            });
          } else {
            this.appendSystemLine('    Stations:    none');
          }
        }

        // ---- Batman-adv ----
        if (debug && debug.batman) {
          const b = debug.batman;
          this.appendSystemLine('');
          this.appendSystemLine('  BATMAN-ADV');
          this.appendSystemLine(`    Version:     ${b.version}`);
          this.appendSystemLine(`    Algorithm:   ${b.algorithm}`);
          this.appendSystemLine(`    GW mode:     ${b.gateway_mode}`);
          this.appendSystemLine(`    Neighbors:   ${b.neighbor_count}`);

          if (b.neighbors && b.neighbors.length > 0) {
            b.neighbors.forEach(n => {
              this.appendSystemLine(`      ${n.mac} via ${n.interface} (seen ${n.last_seen})`);
            });
          }

          if (b.originators && b.originators.length > 0) {
            this.appendSystemLine(`    Originators: ${b.originators.length}`);
            b.originators.forEach(o => {
              this.appendSystemLine(`      ${o.originator} TQ:${o.tq}/255 via ${o.nexthop || 'direct'} (${o.last_seen})`);
            });
          }
        }

        // ---- Bridge ----
        if (debug && debug.bridge) {
          const br = debug.bridge;
          this.appendSystemLine('');
          this.appendSystemLine('  BRIDGE');
          this.appendSystemLine(`    Status:      ${br.status}`);
          this.appendSystemLine(`    IP:          ${br.ip}`);
          this.appendSystemLine(`    Ports:       ${br.ports}`);
        }

        // ---- Discovery peers ----
        if (debug && debug.discovery && debug.discovery.peers) {
          const peers = debug.discovery.peers;
          this.appendSystemLine('');
          this.appendSystemLine('  DISCOVERED PEERS');
          if (peers.length > 0) {
            peers.forEach(p => {
              this.appendSystemLine(`    Node #${p.node}: ${p.name} @ ${p.ip} (${p.age_seconds}s ago)`);
            });
          } else {
            this.appendSystemLine('    No peers discovered yet');
          }
        }

        // ---- Systemd services ----
        if (debug && debug.systemd) {
          this.appendSystemLine('');
          this.appendSystemLine('  SYSTEMD SERVICES');
          debug.systemd.forEach(s => {
            const icon = s.active === 'active' ? '+' : '-';
            this.appendSystemLine(`    [${icon}] ${s.name.padEnd(28)} ${s.active} (${s.sub})`);
          });
        }

        // ---- IRC bridge status ----
        if (bridge) {
          this.appendSystemLine('');
          this.appendSystemLine('  IRC BRIDGE');
          if (bridge.bridge) {
            const b = bridge.bridge;
            this.appendSystemLine(`    Uptime:      ${b.uptime_human}`);
            this.appendSystemLine(`    Clients:     ${b.active_clients} active, ${b.total_served} total served`);
            this.appendSystemLine(`    Memory:      ${b.memory_mb.toFixed(1)}MB`);
            this.appendSystemLine(`    Goroutines:  ${b.goroutines}`);
            if (b.clients && b.clients.length > 0) {
              b.clients.forEach(c => {
                this.appendSystemLine(`      ${c.id} from ${c.ip} (buf: ${c.send_buffer}/256)`);
              });
            }
          }
          if (bridge.irc) {
            this.appendSystemLine(`    IRC server:  ${bridge.irc.server} [${bridge.irc.status}]`);
            if (bridge.irc.latency_ms >= 0) {
              this.appendSystemLine(`    IRC latency: ${bridge.irc.latency_ms}ms`);
            }
          }
        }

        // ---- Conflict warning ----
        if (debug && debug.conflict) {
          this.appendSystemLine('');
          this.appendSystemLine(`  *** CONFLICT: ${debug.conflict} ***`);
        }

        // ---- WebSocket client-side info ----
        this.appendSystemLine('');
        this.appendSystemLine('  CLIENT (your browser)');
        this.appendSystemLine(`    WebSocket:   ${this.connected ? 'connected' : 'disconnected'}`);
        this.appendSystemLine(`    WS URL:      ws://${window.location.host}/ws`);
        this.appendSystemLine(`    Page origin: ${window.location.origin}`);
        this.appendSystemLine(`    IRC nick:    ${this.nickname} (registered: ${this.registered})`);
        this.appendSystemLine(`    Users seen:  ${this.userCount}`);
        this.appendSystemLine(`    User agent:  ${navigator.userAgent.substring(0, 80)}`);

        // ---- Errors ----
        if (!debug && !bridge) {
          this.appendSystemLine('');
          this.appendSystemLine('  ERROR: Could not fetch debug info from server');
          this.appendSystemLine('  Both /api/debug and /api/bridge-status failed');
          this.appendSystemLine('  Check if nightwatch-debug service is running');
        } else if (!debug) {
          this.appendSystemLine('');
          this.appendSystemLine('  WARNING: /api/debug unavailable (nightwatch-debug service may not be running)');
        }

        this.appendSystemLine('');
        this.appendSystemLine(`${sep}`);
        this.appendSystemLine(`  Collected at: ${debug ? debug.collected_at : new Date().toISOString()}`);
        this.appendSystemLine(`${sep}`);

        this.scrollToBottom();
      }

      // ---- Debug polling & live status bar ----
      startDebugPolling() {
        // Initial fetch after short delay (let WebSocket connect first)
        setTimeout(() => this.fetchDebugData(), 2000);
        // Then poll every 15s
        this.debugInterval = setInterval(() => this.fetchDebugData(), 15000);
      }

      async fetchDebugData() {
        // Cancel any in-flight fetch from a previous poll cycle (prevents pile-up
        // on slow networks where a 15s fetch outlasts the 15s interval)
        if (this.debugAbort) this.debugAbort.abort();
        this.debugAbort = new AbortController();
        const signal = this.debugAbort.signal;
        try {
          const [debugRes, bridgeRes] = await Promise.allSettled([
            fetch('/api/debug', { signal }).then(r => r.ok ? r.json() : null).catch(() => null),
            fetch('/api/bridge-status', { signal }).then(r => r.ok ? r.json() : null).catch(() => null)
          ]);
          const newDebug = debugRes.status === 'fulfilled' ? debugRes.value : null;
          const newBridge = bridgeRes.status === 'fulfilled' ? bridgeRes.value : null;

          // Detect peer changes before updating state
          if (newDebug && newDebug.discovery && newDebug.discovery.peers) {
            this.detectPeerChanges(newDebug.discovery.peers);
          }

          this.debugData = newDebug;
          this.bridgeData = newBridge;
          this.updateTopStatusBar();
        } catch (e) {
          // Silently ignore — status bar just stays stale
        }
      }

      detectPeerChanges(peers) {
        const currentPeerIds = new Set(peers.map(p => p.node));

        // Detect new peers
        currentPeerIds.forEach(id => {
          if (!this.knownPeers.has(id)) {
            const peer = peers.find(p => p.node === id);
            if (peer && this.knownPeers.size > 0) {
              // Only announce if we already had peers (skip initial load)
              this.addJoinPart(`Node #${peer.node} (${peer.ip}) joined the mesh`);
            }
          }
        });

        // Detect lost peers
        this.knownPeers.forEach(id => {
          if (!currentPeerIds.has(id)) {
            this.addJoinPart(`Node #${id} left the mesh`);
          }
        });

        this.knownPeers = currentPeerIds;
      }

      updateTopStatusBar() {
        const d = this.debugData;
        if (!d) return;

        // Left side: node identity
        if (d.node) {
          this.nodeLabel.textContent = `NIGHTWATCH #${d.node.number}`;
        }

        // Middle: mesh peers and signal
        const parts = [];
        if (d.discovery && d.discovery.peers) {
          const peerCount = d.discovery.peers.length;
          const totalNodes = peerCount + 1; // include self
          parts.push(`Nodes:${totalNodes}`);
        }
        if (d.mesh && d.mesh.stations && d.mesh.stations.length > 0) {
          const bestSignal = d.mesh.stations.reduce((best, s) => {
            const sig = s.signal ? parseInt(s.signal, 10) : NaN;
            return !isNaN(sig) && sig > best ? sig : best;
          }, -999);
          if (bestSignal > -999) parts.push(`Sig:${bestSignal}dBm`);
        }
        this.meshInfo.textContent = parts.length > 0 ? parts.join(' | ') : '';

        // Right side: system stats
        const stats = [];
        if (d.system) {
          stats.push(`${d.system.cpu_temp_c}C`);
          stats.push(`${d.system.memory_available_mb}MB`);
        }
        if (this.bridgeData && this.bridgeData.bridge) {
          stats.push(`WS:${this.bridgeData.bridge.active_clients}`);
        }
        this.meshStats.textContent = stats.length > 0 ? stats.join(' | ') : '';
      }

      // /nodes command — lightweight network map
      async showNodesInfo() {
        // Use cached data if fresh enough, otherwise fetch
        if (!this.debugData) {
          this.addSystemMessage('Fetching mesh info...');
          await this.fetchDebugData();
        }
        const d = this.debugData;
        const b = this.bridgeData;

        this.appendSystemLine('');
        const sep = '~'.repeat(40);
        this.appendSystemLine(sep);
        this.appendSystemLine('  MESH NETWORK MAP');
        this.appendSystemLine(sep);

        // This node
        if (d && d.node) {
          const n = d.node;
          const gw = n.gateway ? ' [GATEWAY]' : '';
          this.appendSystemLine('');
          this.appendSystemLine(`  * Node #${n.number} (${n.hostname}) ${n.mesh_ip}${gw}  <-- you are here`);
          if (n.model) this.appendSystemLine(`    Model: ${n.model}`);
          this.appendSystemLine(`    Uptime: ${n.uptime}`);
          if (d.system) {
            this.appendSystemLine(`    CPU: ${d.system.cpu_temp_c}C | RAM: ${d.system.memory_available_mb}/${d.system.memory_total_mb}MB | Disk: ${d.system.disk_usage_pct}%`);
          }
        }

        // Peer nodes
        if (d && d.discovery && d.discovery.peers && d.discovery.peers.length > 0) {
          d.discovery.peers.forEach(p => {
            this.appendSystemLine('');
            const peerName = `nightwatch-${p.node}`;
            this.appendSystemLine(`    Node #${p.node} (${peerName}) ${p.ip}  [seen ${p.age_seconds}s ago]`);
          });
        } else {
          this.appendSystemLine('');
          this.appendSystemLine('    (no other nodes discovered)');
        }

        // Mesh links with signal
        if (d && d.mesh && d.mesh.stations && d.mesh.stations.length > 0) {
          this.appendSystemLine('');
          this.appendSystemLine('  MESH LINKS');
          d.mesh.stations.forEach(s => {
            const sig = s.signal ? `${s.signal}dBm` : '?';
            const plink = s.plink || '?';
            this.appendSystemLine(`    ${s.mac} [${plink}] signal: ${sig}`);
          });
        }

        // Connected IRC users
        if (b && b.bridge && b.bridge.clients && b.bridge.clients.length > 0) {
          this.appendSystemLine('');
          this.appendSystemLine(`  CONNECTED USERS (${b.bridge.active_clients})`);
          b.bridge.clients.forEach(c => {
            this.appendSystemLine(`    ${c.id} from ${c.ip}`);
          });
        } else if (this.users.length > 0) {
          this.appendSystemLine('');
          this.appendSystemLine(`  CHAT USERS (${this.userCount})`);
          this.users.filter(u => !u.includes('.irc')).forEach(u => {
            const label = u === this.nickname ? `${u} (you)` : u;
            this.appendSystemLine(`    ${label}`);
          });
        }

        this.appendSystemLine('');
        this.appendSystemLine(sep);
        this.scrollToBottom();
      }

      scrollToBottom() {
        // Trim first (may adjust scrollTop), then check if user is near bottom
        this.trimMessages();
        const threshold = 60; // px
        const atBottom = (this.chatArea.scrollHeight - this.chatArea.scrollTop - this.chatArea.clientHeight) < threshold;
        if (atBottom) this.chatArea.scrollTop = this.chatArea.scrollHeight;
      }

      trimMessages() {
        // Only trim when 10% over the cap to avoid running the loop on every message
        const MAX_MESSAGES = 1000;
        const TRIM_THRESHOLD = 1100;
        if (this.chatArea.children.length <= TRIM_THRESHOLD) return;
        // Track removed height so we can adjust scrollTop and prevent
        // the visible content from jumping when top elements are removed.
        const scrollBefore = this.chatArea.scrollTop;
        let removedHeight = 0;
        while (this.chatArea.children.length > MAX_MESSAGES) {
          removedHeight += this.chatArea.firstChild.offsetHeight;
          this.chatArea.removeChild(this.chatArea.firstChild);
        }
        this.chatArea.scrollTop = scrollBefore - removedHeight;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const terminal = new IrssiTerminal();
      window.addEventListener('beforeunload', () => {
        if (terminal.debugInterval) { clearInterval(terminal.debugInterval); terminal.debugInterval = null; }
        if (terminal.debugAbort) { terminal.debugAbort.abort(); terminal.debugAbort = null; }
        if (terminal.reconnectTimer) { clearTimeout(terminal.reconnectTimer); terminal.reconnectTimer = null; }
        if (terminal.ws) {
          terminal.ws.onclose = null;
          terminal.ws.onerror = null;
          terminal.ws.onmessage = null;
          terminal.ws.onopen = null;
          terminal.ws.close();
          terminal.ws = null;
        }
      });
    });
  </script>
</body>
</html>
