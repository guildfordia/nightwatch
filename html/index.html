<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>nightwatch</title>
  <style>
    :root {
      --vh: 1vh; /* updated by JS for mobile browsers */
      --bg-primary: #000000;
      --bg-secondary: #000088;
      --bg-secondary-hover: #0000aa;
      --text-primary: #cccccc;
      --text-secondary: #ffffff;
      --text-system: #0088ff;
      --text-error: #ff0000;
      --text-join: #00ff00;
      --text-highlight: #ffff00;
      --text-time: #888888;
      --text-nick-self: #ffb3d9;
      --text-nick-other: #b3e5d1;
      --text-own: #ffffff;
      --border-color: #333333;
      --user-list-bg: #000000;
    }
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #e6e6fa;
      --bg-secondary-hover: #d0d0d0;
      --text-primary: #333333;
      --text-secondary: #000000;
      --text-system: #0066cc;
      --text-error: #cc0000;
      --text-join: #008800;
      --text-highlight: #cc6600;
      --text-time: #666666;
      --text-nick-self: #d147a3;
      --text-nick-other: #16a085;
      --text-own: #000000;
      --border-color: #cccccc;
      --user-list-bg: #f8f8f8;
    }
    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-secondary: #000088;
      --bg-secondary-hover: #0000aa;
      --text-primary: #cccccc;
      --text-secondary: #ffffff;
      --text-system: #0088ff;
      --text-error: #ff0000;
      --text-join: #00ff00;
      --text-highlight: #ffff00;
      --text-time: #888888;
      --text-nick-self: #ffb3d9;
      --text-nick-other: #b3e5d1;
      --text-own: #ffffff;
      --border-color: #333333;
      --user-list-bg: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', 'Liberation Mono', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      /* Use real visual viewport on mobile */
      height: calc(var(--vh) * 100);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.0;
      /* Let the page scroll if it needs to; main chat area scrolls independently */
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .irssi-terminal {
      height: calc(var(--vh) * 100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-status-bar {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .top-status-left { color: var(--text-secondary); }
    .top-status-right { color: var(--text-secondary); }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden; /* contain child overflows */
      min-height: 0; /* allow flex children to shrink properly */
    }

    .chat-area {
      flex: 1;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      overflow-y: auto; /* scroll here */
      overflow-x: hidden;
      white-space: pre-wrap;
      font-family: inherit;
    }

    .user-list {
      width: 200px;
      background: var(--user-list-bg);
      border-left: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0;
      overflow-y: auto;
      flex-shrink: 0;
      display: none; /* hidden by default on small screens */
    }
    .user-list.visible { display: block !important; }
    @media (min-width: 1200px) {
      .user-list:not(.hidden) { display: block; }
      .user-list.hidden { display: none !important; }
    }
    .user-list-header {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      border-bottom: 1px solid var(--border-color);
    }
    .user-item {
      padding: 0 1ch;
      color: var(--text-nick-other);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-item.self { color: var(--text-nick-self); font-weight: bold; }

    .toggle-button,
    .about-link,
    .theme-selector {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: none;
      height: 1.2em;
      line-height: 1.2em;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }
    .toggle-button { padding: 0 1ch; margin-left: auto; }
    .toggle-button:hover { background: var(--bg-secondary-hover); }
    .about-link { background: transparent; text-decoration: underline; padding: 0; }
    .about-link:hover { color: var(--text-primary); }
    .theme-selector { padding: 0 0.5ch; margin-left: 0.5ch; }
    .theme-selector option { background: var(--bg-secondary); color: var(--text-secondary); }

    .status-bar {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 0 1ch;
      min-height: 1.2em;
      line-height: 1.2em;
      font-weight: normal;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5ch;
      flex-shrink: 0;
    }
    .status-left { color: var(--text-secondary); }
    .status-right { color: var(--text-primary); display: flex; flex-wrap: wrap; align-items: center; gap: 0.5ch; }

    .message { padding: 0 1ch; display: block; white-space: pre-wrap; word-wrap: break-word; }
    .time { color: var(--text-time); }
    .nick-self { color: var(--text-nick-self); }
    .nick-other { color: var(--text-nick-other); }
    .text { color: var(--text-primary); }
    .text-own { color: var(--text-own); }
    .system { color: var(--text-system); }
    .error { color: var(--text-error); }
    .join-part { color: var(--text-join); }
    .highlight { color: var(--text-highlight); }

    .input-bar {
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 0 1ch;
      height: calc(1.2em + env(safe-area-inset-bottom));
      line-height: 1.2em;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border-color);
      /* Keep visible on mobile while scrolling */
      position: sticky;
      bottom: 0;
      z-index: 2;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .input-prompt { color: var(--text-secondary); white-space: pre; }
    .input-field {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      outline: none;
      padding: 0;
      margin: 0;
      /* mobile typing niceties */
      -webkit-appearance: none;
      -webkit-text-size-adjust: 100%;
      caret-color: var(--text-secondary);
      touch-action: manipulation;
    }

    .chat-area::-webkit-scrollbar,
    .user-list::-webkit-scrollbar { width: 0px; background: transparent; }

    @media (max-width: 600px) {
      .status-bar { flex-direction: column; align-items: stretch; gap: 0; }
      .status-left, .status-right { justify-content: center; padding: 0.1em 0; }
      .status-right { justify-content: center; flex-wrap: wrap; }
    }
    @media (max-width: 800px) and (min-width: 601px) {
      .status-bar { gap: 0.25ch; }
      .status-right { gap: 0.25ch; }
    }
  </style>
</head>
<body>
  <div class="irssi-terminal">
    <div class="top-status-bar">
      <div class="top-status-left" id="topStatusLeft">NIGHTWATCH</div>
      <div class="top-status-right">
        <span id="connectionStatus">[disconnected]</span>
        <button class="about-link" id="aboutLink">about</button>
      </div>
    </div>

    <div class="main-content">
      <div class="chat-area" id="chatArea"></div>
      <div class="user-list" id="userList">
        <div class="user-list-header">Users</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left" id="statusLeft">[ #nightwatch ]</div>
      <div class="status-right">
        <span id="statusRight">[connecting]</span>
        <select class="theme-selector" id="themeSelector">
          <option value="auto">Auto</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
        <button class="toggle-button" id="toggleUsers">Users</button>
      </div>
    </div>

    <div class="input-bar">
      <span class="input-prompt" id="inputPrompt">[guest] </span>
      <input type="text" class="input-field" id="inputField" disabled />
    </div>
  </div>

  <script>
    // Visual viewport fix for mobile (keeps input bar visible)
    function setRealVh() {
      const vh = window.visualViewport ? window.visualViewport.height * 0.01 : window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', setRealVh);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setRealVh);
    }

    class ThemeManager {
      constructor() {
        this.themes = ['auto', 'dark', 'light'];
        this.currentTheme = this.getSavedTheme();
        this.selector = null;
        this.mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        this.applyTheme(this.currentTheme);
        this.mediaQuery.addEventListener('change', () => {
          if (this.currentTheme === 'auto') this.applyAutoTheme();
        });
      }
      initSelector(selector) {
        this.selector = selector;
        this.selector.value = this.currentTheme;
        this.selector.addEventListener('change', (e) => this.setTheme(e.target.value));
      }
      getSavedTheme() { return localStorage.getItem('nightwatch-theme') || 'auto'; }
      saveTheme(theme) { localStorage.setItem('nightwatch-theme', theme); }
      setTheme(theme) {
        if (!this.themes.includes(theme)) return;
        this.currentTheme = theme;
        this.saveTheme(theme);
        this.applyTheme(theme);
        if (this.selector) this.selector.value = theme;
      }
      applyTheme(theme) { theme === 'auto' ? this.applyAutoTheme() : document.body.setAttribute('data-theme', theme); }
      applyAutoTheme() {
        const prefersDark = this.mediaQuery.matches;
        document.body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
      getEffectiveTheme() { return this.currentTheme === 'auto' ? (this.mediaQuery.matches ? 'dark' : 'light') : this.currentTheme; }
    }

    class IrssiTerminal {
      constructor() {
        this.ws = null;
        this.connected = false;
        this.nickname = 'guest';
        this.channel = '#nightwatch';
        this.registered = false;
        this.userCount = 0;
        this.users = [];
        this.nickMap = {};
        this.pendingNickChange = null;
        this.userListVisible = window.innerWidth >= 1200;
        this.bannerRendered = false; // prevent re-render on resize
        this.reconnectDelay = 1000; // start at 1s, exponential backoff
        this.maxReconnectDelay = 30000; // cap at 30s

        this.themeManager = new ThemeManager();
        this.initElements();
        this.connect();
      }

      initElements() {
        this.chatArea = document.getElementById('chatArea');
        this.userList = document.getElementById('userList');
        this.inputField = document.getElementById('inputField');
        this.inputPrompt = document.getElementById('inputPrompt');
        this.statusLeft = document.getElementById('statusLeft');
        this.statusRight = document.getElementById('statusRight');
        this.toggleButton = document.getElementById('toggleUsers');
        this.themeSelector = document.getElementById('themeSelector');
        this.connectionStatus = document.getElementById('connectionStatus');
        this.aboutLink = document.getElementById('aboutLink');

        this.inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') this.sendMessage(); });
        this.toggleButton.addEventListener('click', () => this.toggleUserList());
        this.aboutLink.addEventListener('click', () => this.showAbout());

        this.themeManager.initSelector(this.themeSelector);

        this.showWelcomeBanner();  // render once
        this.updatePrompt();
        this.updateUserListVisibility();
        this.connectionStatus.textContent = '[connecting]';
      }

      showWelcomeBanner() {
        if (this.bannerRendered) return;
        this.bannerRendered = true;

        const userListWidth = 200;
        const smallBannerWidth = 38 * 9;
        const largeBannerWidth = 88 * 9;
        const canFitLargeBanner = window.innerWidth >= 1000;
        const canFitSmallBannerWithUserList = window.innerWidth >= (smallBannerWidth + userListWidth);

        let banner = null;
        let isMobile = false;

        if (canFitLargeBanner) {
          banner = [
            "███╗   ██╗██╗ ██████╗ ██╗  ██╗████████╗██╗    ██╗ █████╗ ████████╗ ██████╗██╗  ██╗",
            "████╗  ██║██║██╔════╝ ██║  ██║╚══██╔══╝██║    ██║██╔══██╗╚══██╔══╝██╔════╝██║  ██║",
            "██╔██╗ ██║██║██║  ███╗███████║   ██║   ██║ █╗ ██║███████║   ██║   ██║     ███████║",
            "██║╚██╗██║██║██║   ██║██╔══██║   ██║   ██║███╗██║██╔══██║   ██║   ██║     ██╔══██║",
            "██║ ╚████║██║╚██████╔╝██║  ██║   ██║   ╚███╔███╔╝██║  ██║   ██║   ╚██████╗██║  ██║",
            "╚═╝  ╚═══╝╚═╝ ╚═════╝ ╚═╝  ╚═╝   ╚═╝    ╚══╝╚══╝ ╚═╝  ╚═╝   ╚═╝    ╚═════╝╚═╝  ╚═╝"
          ];
        } else if (canFitSmallBannerWithUserList) {
          banner = [
            "░█▀█░▀█▀░█▀▀░█░█░▀█▀░█░█░█▀█░▀█▀░█▀▀░█░█",
            "░█░█░░█░░█░█░█▀█░░█░░█▄█░█▀█░░█░░█░░░█▀█",
            "░▀░▀░▀▀▀░▀▀▀░▀░▀░░▀░░▀░▀░▀░▀░░▀░░▀▀▀░▀░▀"
          ];
          isMobile = true;
        }

        if (banner) {
          banner.forEach(line => this.appendSystemLine(line));
        }

        if (!banner || isMobile) {
          this.addSystemMessage('Welcome to NIGHTWATCH');
          this.addSystemMessage('Decentralized Mesh Network');
          this.addSystemMessage('Off-Grid conversation');
          this.addSystemMessage('Type /nick <name> to change nick');
        } else {
          this.addSystemMessage('Welcome to NIGHTWATCH - Decentralized Mesh Network - Off-Grid conversation');
          this.addSystemMessage('Type /nick <name> to change your nickname');
        }
        this.addSystemMessage('Connecting to IRC bridge...');
      }

      connect() {
        const wsUrl = `ws://${window.location.hostname}/ws`;
        try { this.ws = new WebSocket(wsUrl); }
        catch (error) { this.addSystemMessage(`WebSocket error: ${error.message}`); return; }

        this.ws.onopen = () => {
          this.connected = true;
          this.reconnectDelay = 1000; // reset backoff on successful connect
          this.updateStatus('connected');
        };
        this.ws.onmessage = (event) => this.handleMessage(event.data);
        this.ws.onclose = (event) => {
          this.connected = false;
          this.registered = false;
          this.updateStatus('disconnected');
          this.inputField.disabled = true;
          const delaySec = (this.reconnectDelay / 1000).toFixed(0);
          this.addSystemMessage(`Connection lost (${event.code}). Reconnecting in ${delaySec}s...`);
          setTimeout(() => this.connect(), this.reconnectDelay);
          this.reconnectDelay = Math.min(this.reconnectDelay * 2, this.maxReconnectDelay);
        };
        this.ws.onerror = () => { this.addSystemMessage('Connection error'); };
      }

      send(line) { if (this.ws && this.connected) this.ws.send(line + '\r\n'); }

      sendMessage() {
        const input = this.inputField.value.trim();
        if (!input || !this.connected) return;

        if (input.startsWith('/nick ')) {
          const newNick = input.slice(6).trim();
          if (newNick && newNick !== this.nickname) {
            this.pendingNickChange = newNick;
            this.send(`NICK ${newNick}`);
            this.addSystemMessage(`Attempting to change nickname to: ${newNick}`);
          } else if (!newNick) {
            this.addSystemMessage('Usage: /nick <new_nickname>');
          } else {
            this.addSystemMessage('You are already using that nickname');
          }
          this.inputField.value = '';
          return;
        }

        if (!this.registered) {
          this.addSystemMessage('Not connected to IRC yet, please wait...');
          this.inputField.value = '';
          return;
        }

        this.send(`PRIVMSG ${this.channel} :${input}`);
        this.addChatMessage(this.nickname, input, true);
        this.inputField.value = '';
      }

      handleMessage(data) {
        const lines = data.split('\r\n').filter(line => line.trim());
        lines.forEach(line => {
          // RPL_WELCOME
          if (line.includes(' 001 ') || line.includes('Welcome to the')) {
            this.registered = true;
            this.inputField.disabled = false;
            this.updateStatus('active');
            this.addSystemMessage('Registration successful');
            // Auto join and request names list
            this.send(`JOIN ${this.channel}`);
            this.send(`NAMES ${this.channel}`);

            if (!this.users.includes(this.nickname)) {
              this.users.push(this.nickname);
              this.userCount = this.users.length;
              this.updateUserList();
            }
            this.addJoinPart(`${this.nickname} has joined ${this.channel}`);
          }
          // Nickname in use
          else if (line.includes(' 433 ')) {
            this.nickname = this.nickname + '_';
            this.send(`NICK ${this.nickname}`);
            this.addSystemMessage(`Nickname in use, trying ${this.nickname}`);
            this.updatePrompt();
          }
          // Names list
          else if (line.includes(' 353 ')) {
            const names = line.split(':').pop().trim().split(' ');
            this.users = names.filter(name => name.trim() && !name.includes('.irc') && !name.includes('nightwatch'));
            this.userCount = this.users.length;
            this.updateStatus();
            this.updateUserList();
          }
          // Nick changes
          else if (line.includes(' NICK :')) {
            const match = line.match(/:([^!]+)![^:]+NICK :(.+)/);
            if (match) {
              const oldIrcNick = match[1];
              const newIrcNick = match[2];
              const isOurNickChange =
                (this.pendingNickChange && newIrcNick === this.pendingNickChange) ||
                this.nickMap[oldIrcNick] === this.nickname ||
                oldIrcNick === this.nickname;

              if (isOurNickChange) {
                this.nickname = this.pendingNickChange || newIrcNick;
                this.pendingNickChange = null;
                this.nickMap[newIrcNick] = this.nickname;
                this.updatePrompt();
                this.updateUserList();
                this.addSystemMessage(`You are now known as ${this.nickname}`);
              } else {
                const idx = this.users.indexOf(oldIrcNick);
                if (idx !== -1) this.users[idx] = newIrcNick;
                if (this.nickMap[oldIrcNick]) {
                  this.nickMap[newIrcNick] = this.nickMap[oldIrcNick];
                  delete this.nickMap[oldIrcNick];
                } else {
                  this.nickMap[newIrcNick] = newIrcNick;
                }
                this.updateUserList();
                this.addJoinPart(`${oldIrcNick} is now known as ${newIrcNick}`);
              }
            }
          }
          // JOIN — add user to list
          else if (line.includes(' JOIN ')) {
            const match = line.match(/:([^!]+)![^ ]+ JOIN/);
            if (match) {
              const nick = match[1];
              if (nick !== this.nickname && !this.users.includes(nick)) {
                this.users.push(nick);
                this.userCount = this.users.length;
                this.updateUserList();
              }
              if (nick !== this.nickname) {
                this.addJoinPart(`${nick} has joined ${this.channel}`);
              }
            }
          }
          // PART — remove user from list
          else if (line.includes(' PART ')) {
            const match = line.match(/:([^!]+)![^ ]+ PART/);
            if (match) {
              const nick = match[1];
              this.users = this.users.filter(u => u !== nick);
              this.userCount = this.users.length;
              this.updateUserList();
              this.addJoinPart(`${nick} has left ${this.channel}`);
            }
          }
          // QUIT — remove user from list
          else if (line.includes(' QUIT ')) {
            const match = line.match(/:([^!]+)![^ ]+ QUIT/);
            if (match) {
              const nick = match[1];
              this.users = this.users.filter(u => u !== nick);
              delete this.nickMap[nick];
              this.userCount = this.users.length;
              this.updateUserList();
              const reason = line.includes(':') ? line.split('QUIT :')[1] || '' : '';
              this.addJoinPart(`${nick} has quit${reason ? ` (${reason})` : ''}`);
            }
          }
          // PRIVMSG & CTCP ACTION
          else if (line.includes(' PRIVMSG ')) {
            const match = line.match(/:([^!]+)![^:]+PRIVMSG [^:]+:(.+)/);
            if (match && match[1] !== this.nickname) {
              const nick = match[1];
              const message = match[2];
              if (message.startsWith('\x01ACTION') && message.endsWith('\x01')) {
                const action = message.slice(8, -1);
                this.addAction(nick, action);
              } else {
                this.addChatMessage(nick, message, false);
              }
            }
          }
          // PING -> PONG
          else if (line.startsWith('PING')) {
            this.send(line.replace('PING', 'PONG'));
          }
        });
      }

      getTime() {
        const now = new Date();
        return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      }

      appendSystemLine(text) {
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="system">${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
      }

      addChatMessage(nick, text, isOwn) {
        const time = this.getTime();
        const nickClass = isOwn ? 'nick-self' : 'nick-other';
        const textClass = isOwn ? 'text-own' : 'text';
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="${nickClass}">&lt;${this.escapeHtml(nick)}&gt;</span> <span class="${textClass}">${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addAction(nick, action) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="nick-other">* ${this.escapeHtml(nick)}</span> <span class="text">${this.escapeHtml(action)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addSystemMessage(text) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="system">-!- ${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      addJoinPart(text) {
        const time = this.getTime();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<span class="time">${time}</span> <span class="join-part">-!- ${this.escapeHtml(text)}</span>`;
        this.chatArea.appendChild(el);
        this.scrollToBottom();
      }

      updatePrompt() { this.inputPrompt.textContent = `[${this.nickname}] `; }

      toggleUserList() {
        this.userListVisible = !this.userListVisible;
        this.updateUserListVisibility();
      }
      updateUserListVisibility() {
        if (this.userListVisible) {
          this.userList.classList.add('visible');
          this.userList.classList.remove('hidden');
          this.toggleButton.textContent = 'Hide Users';
        } else {
          this.userList.classList.remove('visible');
          this.userList.classList.add('hidden');
          this.toggleButton.textContent = 'Show Users';
        }
      }

      updateUserList() {
        const header = this.userList.querySelector('.user-list-header');
        this.userList.innerHTML = '';
        this.userList.appendChild(header);

        const displayUsers = new Set();
        displayUsers.add(this.nickname);

        this.users.forEach(ircUser => {
          // Filter out IRC server names, keep all real users (including webuser*)
          if (!ircUser.includes('.irc') && !ircUser.includes('nightwatch')) {
            const displayName = this.nickMap[ircUser] || ircUser;
            displayUsers.add(displayName);
          }
        });

        const sorted = [...displayUsers].sort((a, b) =>
          a === this.nickname ? -1 : b === this.nickname ? 1 : a.localeCompare(b)
        );

        sorted.forEach(user => {
          const el = document.createElement('div');
          el.className = 'user-item';
          if (user === this.nickname) el.classList.add('self');
          el.textContent = user;
          this.userList.appendChild(el);
        });

        this.userCount = sorted.length;
        header.textContent = `Users (${this.userCount})`;
      }

      updateStatus(connectionStatus = null) {
        if (connectionStatus) {
          this.statusRight.textContent = `[${connectionStatus}]`;
          this.connectionStatus.textContent = `[${connectionStatus}]`;
        }
        if (this.registered && this.userCount > 0) {
          this.statusRight.textContent = `[users: ${this.userCount}]`;
          this.connectionStatus.textContent = `[connected]`;
        }
      }

      showAbout() {
        [
          "╔════════════════════════════════════════════════════════════════════╗",
          "║                            NIGHTWATCH                             ║",
          "║                    Decentralized Mesh Network                     ║",
          "║                                                                    ║",
          "║  A resilient chat system designed for off-grid communication      ║",
          "║  using Batman Advanced mesh networking protocol.                   ║",
          "║                                                                    ║",
          "║  Features:                                                         ║",
          "║  • Zero-infrastructure messaging                                   ║",
          "║  • Automatic node discovery                                        ║",
          "║  • Self-healing network topology                                   ║",
          "║  • Terminal-style interface                                        ║",
          "║                                                                    ║",
          "║  Commands:                                                         ║",
          "║  /nick <name>  - Change your nickname                             ║",
          "║                                                                    ║",
          "║  Built with love for decentralized communication                  ║",
          "╚════════════════════════════════════════════════════════════════════╝"
        ].forEach(line => this.appendSystemLine(line));
        this.scrollToBottom();
      }

      scrollToBottom() {
        // If user is near bottom, auto-scroll; otherwise, respect their position
        const threshold = 60; // px
        const atBottom = (this.chatArea.scrollHeight - this.chatArea.scrollTop - this.chatArea.clientHeight) < threshold;
        if (atBottom) this.chatArea.scrollTop = this.chatArea.scrollHeight;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    window.addEventListener('DOMContentLoaded', () => { new IrssiTerminal(); });
  </script>
</body>
</html>
