[Global]
Name = whitenode.nightwatch.irc
AdminInfo1 = Nightwatch IRC Server - Pi 3
AdminInfo2 = Anywhere On Earth
AdminEMail = rum@xpec.net
Listen = 0.0.0.0
MotdPhrase = Nightwatch - Max 100 users
ServerUID = abc
ServerGID = abc
MaxConnections = 150
MaxConnectionsIP = 25
MaxJoins = 3
MaxNickLength = 12
PingTimeout = 300
PongTimeout = 60
IdleTimeout = 900

[Options]
RequireAuthPing = no
PAM = no
Bind = 0.0.0.0
Port = 6667
MaxChannels = 1
MaxListSize = 100

[Limits]
MaxNickLength = 12
MaxChannelNameLength = 15
MaxTopicLength = 80
MaxAwayLen = 40

[Channel]
name = #nightwatch
topic = Nightwatch Chat [Max 100 users]
modes = +nt
maxusers = 100

# Server linking configuration for mesh network
# This Pi will connect to other Pis through the mesh network

[Server]
Name = bluenode.nightwatch.irc
Host = 192.168.199.101
Port = 6667
MyPassword = meshpass123
PeerPassword = meshpass123
Group = 1
Passive = no

[Server]
Name = blacknode.nightwatch.irc
Host = 192.168.199.102
Port = 6667
MyPassword = meshpass123
PeerPassword = meshpass123
Group = 1
Passive = no

