upstream irc_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting: 30 req/s per client IP with burst allowance
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression — HTML is ~36KB, compresses well on low-bandwidth mesh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # ---- Captive portal detection ----
    # Phones probe these URLs to detect internet/captive portals.
    # Return 302 redirect (not 204) so Android/iOS detect a captive portal
    # and show "Sign in to network" — tapping it opens the chat page.
    location = /generate_204 { return 302 http://$server_addr/; }
    location = /gen_204 { return 302 http://$server_addr/; }
    location = /hotspot-detect.html { return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>'; }
    location = /library/test/success.html { return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>'; }
    location = /connecttest.txt { return 200 'Microsoft Connect Test'; }
    location = /ncsi.txt { return 200 'Microsoft NCSI'; }
    location = /success.txt { return 200 'success'; }

    # RFC 8908 Captive Portal API — Android 11+ and modern devices query this
    # endpoint (advertised via DHCP option 114) to detect captive portals.
    # Returning "captive": true triggers Android's "Sign in to network" prompt.
    location = /api/captive {
        default_type application/captive+json;
        return 200 '{"captive": true, "user-portal-url": "http://$server_addr/", "venue-info-url": "http://$server_addr/"}';
    }

    # ---- Chat frontend ----
    # Users connect by typing http://192.168.199.1 in their browser.
    location / {
        limit_req zone=static burst=50 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 1k;

        # No cache on HTML so code updates are picked up immediately
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Blink LED — triggered by /blink chat command, proxied to irc-bridge
    location = /api/blink {
        proxy_pass http://irc_backend/blink;
        proxy_set_header Host $host;
        default_type text/plain;
    }

    # Debug JSON (generated by nightwatch-debug service every 15s)
    location = /api/debug {
        root /usr/share/nginx/html;
        rewrite ^ /debug.json break;
        add_header Cache-Control "no-cache, no-store";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
    }

    # Bridge status (proxy to irc-bridge /status endpoint)
    location = /api/bridge-status {
        proxy_pass http://irc_backend/status;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
    }

    # Proxy WebSocket connections to IRC bridge
    location /ws {
        client_max_body_size 1k;
        proxy_pass http://irc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts — must be longer than client keepalive (45s)
        # to survive a missed keepalive cycle on a flaky mesh
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
