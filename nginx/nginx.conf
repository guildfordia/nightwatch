upstream irc_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting: 30 req/s per client IP with burst allowance
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression — HTML is ~36KB, compresses well on low-bandwidth mesh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # ---- Chat frontend ----
    # Users connect by typing http://chat.nightwatch or the node IP.
    # DNS wildcard (dnsmasq) resolves all domains to this node.
    location / {
        limit_req zone=static burst=50 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 1k;

        # No cache on HTML so code updates are picked up immediately
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Proxy WebSocket connections to IRC bridge
    location /ws {
        client_max_body_size 1k;
        proxy_pass http://irc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts — must be longer than client keepalive (45s)
        # to survive a missed keepalive cycle on a flaky mesh
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
