upstream irc_backend {
    server irc-bridge:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" always;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # ---- Captive portal detection ----
    # When a phone connects to WiFi, it tests these URLs to check for internet.
    # Returning a 302 redirect triggers the "Sign in to network" popup,
    # which opens the Nightwatch chat page automatically.

    # Apple iOS / macOS
    location /hotspot-detect.html {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /library/test/success.html {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Android / Chrome
    location /generate_204 {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /gen_204 {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Microsoft Windows
    location /connecttest.txt {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /ncsi.txt {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /redirect {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Firefox
    location /canonical.html {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /success.txt {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # ---- Chat frontend ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 1k;

        # Cache static files (short TTL so updates are visible quickly)
        expires 5m;
        add_header Cache-Control "public";
    }

    # Proxy WebSocket connections to IRC bridge
    location /ws {
        proxy_pass http://irc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
