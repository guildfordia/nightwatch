upstream irc_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' ws: wss:" always;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # ---- Captive portal detection ----
    # Phones probe these URLs on WiFi connect. Returning a redirect (instead
    # of the expected success response) triggers the "Sign in to network"
    # popup. That popup opens a special HTTP-only browser — no HTTPS issues.
    # The phone stays connected as long as DHCP is working (dnsmasq).

    # Apple iOS / macOS
    location /hotspot-detect.html {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /library/test/success.html {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Android / Chrome — returning non-204 triggers captive portal popup
    location /generate_204 {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /gen_204 {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Microsoft Windows
    location /connecttest.txt {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /ncsi.txt {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }
    location /redirect {
        add_header Cache-Control "no-store" always;
        return 302 http://$host/;
    }

    # Firefox — return success so Firefox's own captive portal detector stays
    # quiet and lets the Android system show its native "Sign in" popup instead.
    # If Firefox handles it, it silently loads the page in the background with
    # no visible indication to the user.
    location /canonical.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/html" always;
        return 200 "success\n";
    }
    location /success.txt {
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/plain" always;
        return 200 "success\n";
    }

    # ---- Chat frontend ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 1k;

        # Cache static files (short TTL so updates are visible quickly)
        # NOTE: Must repeat security headers here — nginx add_header in a
        # location block replaces (not appends to) server-level add_header.
        expires 5m;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' ws: wss:" always;
    }

    # Bridge status (debug diagnostics)
    location /api/bridge-status {
        proxy_pass http://irc_backend/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Node debug info (collected by shell script, served as static JSON)
    location /api/debug {
        alias /usr/share/nginx/html/debug.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # RFC 8908 Captive Portal API — modern Android 11+/iOS 14+ fetch this
    # URL (provided via DHCP option 114) and expect structured JSON.
    # Returns captive=true so the OS shows a "Sign in to network" notification
    # using its built-in mini-browser, bypassing the default browser entirely.
    location = /api/captive {
        default_type application/captive+json;
        add_header Cache-Control "no-store" always;
        return 200 '{"captive": true, "user-portal-url": "http://$host/"}';
    }

    # Proxy WebSocket connections to IRC bridge
    location /ws {
        proxy_pass http://irc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts — generous for mobile users in park settings
        # (phone may sleep/background for extended periods)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}

# ---- HTTPS catch-all with self-signed cert ----
# Many sites are HSTS-preloaded (lemonde.fr, google.com, etc.) — browsers
# will NEVER try HTTP for these domains. We must accept the TLS connection
# and serve content over HTTPS. The self-signed cert triggers a browser
# warning, but Android's captive portal mini-browser ignores cert errors.
# For regular browsing: Firefox shows "Warning: Potential Security Risk"
# with a "Accept the Risk and Continue" button → chat loads.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/captive.crt;
    ssl_certificate_key /etc/nginx/certs/captive.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;

    # Serve chat page over HTTPS
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # RFC 8908 Captive Portal API
    location = /api/captive {
        default_type application/captive+json;
        add_header Cache-Control "no-store" always;
        return 200 '{"captive": true, "user-portal-url": "http://$host/"}';
    }

    # WebSocket proxy over HTTPS
    location /ws {
        proxy_pass http://irc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
