# BATMAN Advanced Mesh Network Configuration

network:
  interface: "wlan1"
  ip_range: "192.168.199.0/24"
  port: 9080

mesh:
  protocol: "batman-adv"
  nodes:
    - id: "bluenode"
      ip: "192.168.199.101"
    - id: "blacknode"
      ip: "192.168.199.102"
    - id: "whitenode"
      ip: "192.168.199.103"

monitoring:
  enabled: true
  interval: 30
  metrics:
    - "latency"
    - "bandwidth"
    - "packet_loss"
    - "signal_strength"
