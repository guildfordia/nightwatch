services:
  ngircd:
    image: linuxserver/ngircd:latest
    container_name: ngircd
    env_file:
      - ./.env
    volumes:
      - ./ngircd/ngircd.conf:/config/ngircd.conf
    ports:
      - "${IRC_PORT:-6667}:6667"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - irc-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6667 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  irc-bridge:
    build: ./irc-bridge-go
    container_name: irc-bridge
    env_file:
      - ./.env
    # No port exposure — nginx proxies to irc-bridge:3000 via the Docker network.
    # Exposing the bridge directly would bypass nginx security headers.
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - irc-net
    depends_on:
      ngircd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  nginx:
    image: nginx:alpine
    container_name: nginx
    env_file:
      - ./.env
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html
    depends_on:
      irc-bridge:
        condition: service_healthy
    networks:
      - irc-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

networks:
  irc-net:
    name: ${DOCKER_NETWORK:-nightwatch-net}
