services:
  ngircd:
    image: linuxserver/ngircd:latest
    container_name: ngircd
    env_file:
      - ./.env
    volumes:
      - ./ngircd:/config
      - ./ngircd/ngircd.conf:/etc/ngircd/ngircd.conf
    ports:
      - "${IRC_PORT}:${IRC_PORT}"
    restart: unless-stopped
    networks:
      - irc-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6667 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  irc-bridge:
    build: ./irc-bridge-go
    container_name: irc-bridge
    env_file:
      - ./.env
    ports:
      - "${BRIDGE_PORT:-8080}:3000"
    restart: unless-stopped
    networks:
      - irc-net
    depends_on:
      ngircd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  nginx:
    image: nginx:alpine
    container_name: nginx
    env_file:
      - ./.env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html
    depends_on:
      irc-bridge:
        condition: service_healthy
    networks:
      - irc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

networks:
  irc-net:
    name: ${DOCKER_NETWORK}
