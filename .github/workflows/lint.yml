name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every shell script
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f" 2>err.log; then
              echo "::error file=$f::syntax error"
              cat err.log
              fail=1
            fi
          done < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*')
          exit $fail
      - name: shellcheck warnings (informational, doesn't fail the build)
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          # SC1090: can't follow non-constant source — common in our env-loaded scripts, OK
          # SC2086: unquoted vars — pervasive in this codebase, lower priority
          # Run but don't fail; output is logged for awareness
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' \
            -exec shellcheck -e SC1090,SC1091,SC2086 -S warning {} + || true

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: py_compile every .py
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -m py_compile "$f"; then
              echo "::error file=$f::python syntax error"
              fail=1
            fi
          done < <(find . -type f -name '*.py' -not -path './.git/*')
          exit $fail
      - name: ruff (informational)
        run: |
          pip install -q ruff
          # E,F = errors only (no style nits); doesn't fail build
          ruff check --select=E,F --no-fix . || true

  go:
    runs-on: ubuntu-latest
    if: hashFiles('irc-bridge-go/go.mod') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: build
        working-directory: irc-bridge-go
        run: go build ./...
      - name: vet
        working-directory: irc-bridge-go
        run: go vet ./...
      - name: test
        working-directory: irc-bridge-go
        run: go test -short ./...
